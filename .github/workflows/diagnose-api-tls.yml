name: Diagnose MyPets API TLS

on:
  push:
    branches:
      - diag/api-tls-vps-20261005

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.MYPETS_VPS_HOST || secrets.VPS_HOST || secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.MYPETS_VPS_USER || secrets.VPS_USER || secrets.SSH_USER }}
      DEPLOY_KEY: ${{ secrets.MYPETS_VPS_SSH_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      DEPLOY_PORT: ${{ secrets.MYPETS_VPS_PORT || secrets.VPS_PORT || '22' }}
    steps:
      - name: Inspect paused MyPets route and edge compose
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          command_timeout: 5m
          script: |
            set +e
            echo "=== PAUSED MYPETS SITE ==="
            cat /srv/platform/edge/paused/mypets.caddy 2>/dev/null || true
            echo "=== EDGE COMPOSE ==="
            cat /srv/platform/edge/compose.yml 2>/dev/null || cat /srv/platform/edge/docker-compose.yml 2>/dev/null || true
            echo "=== PLATFORM CADDY NETWORKS ==="
            docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} ip={{$v.IPAddress}}{{println}}{{end}}' platform-caddy
            echo "=== MYPETS EDGE NETWORK DETAILS ==="
            docker network inspect mypets_edge --format 'name={{.Name}} scope={{.Scope}} containers={{range $id,$c := .Containers}}{{$c.Name}} {{end}}' 2>/dev/null || true
            echo "=== PLATFORM EDGE NETWORK DETAILS ==="
            docker network inspect platform_edge --format 'name={{.Name}} scope={{.Scope}} containers={{range $id,$c := .Containers}}{{$c.Name}} {{end}}' 2>/dev/null || true
