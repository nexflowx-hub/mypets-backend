name: Diagnose MyPets API TLS

on:
  push:
    branches:
      - diag/api-tls-vps-20261005

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.MYPETS_VPS_HOST || secrets.VPS_HOST || secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.MYPETS_VPS_USER || secrets.VPS_USER || secrets.SSH_USER }}
      DEPLOY_KEY: ${{ secrets.MYPETS_VPS_SSH_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      DEPLOY_PORT: ${{ secrets.MYPETS_VPS_PORT || secrets.VPS_PORT || '22' }}
    steps:
      - name: Inspect exact MyPets edge configuration
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          command_timeout: 5m
          script: |
            set +e
            echo "=== CURRENT COMPOSE ==="
            cat /srv/apps/mypets/api/deploy/compose.yml
            echo "=== MY PETS NETWORKS ==="
            docker network ls --format 'name={{.Name}} driver={{.Driver}}'
            for n in mypets_edge platform_edge; do
              echo "--- network $n ---"
              docker network inspect "$n" --format '{{range $id,$c := .Containers}}{{$c.Name}} {{end}}' 2>/dev/null || true
            done
            echo "=== EDGE CADDYFILE ==="
            cat /srv/platform/edge/Caddyfile 2>/dev/null || true
            echo "=== EDGE SITE FILES ==="
            find /srv/platform/edge/sites -maxdepth 2 -type f -print -exec sh -c 'echo "--- {} ---"; sed -n "1,220p" "{}"' \; 2>/dev/null || true
            echo "=== MY PETS REFERENCES ==="
            grep -Rni -B8 -A24 -E 'api\.mypets\.lat|mypets\.lat|mypets-api|mypets_edge' /srv/platform/edge 2>/dev/null || true
            echo "=== CADDY ADAPTED MY PETS REFERENCES ==="
            docker exec platform-caddy caddy adapt --config /etc/caddy/Caddyfile --pretty 2>/dev/null | grep -n -B8 -A30 -E 'api\.mypets\.lat|mypets-api|mypets_edge' || true
