name: Diagnose MyPets API TLS

on:
  push:
    branches:
      - diag/api-tls-vps-20261005

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.MYPETS_VPS_HOST || secrets.VPS_HOST || secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.MYPETS_VPS_USER || secrets.VPS_USER || secrets.SSH_USER }}
      DEPLOY_KEY: ${{ secrets.MYPETS_VPS_SSH_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      DEPLOY_PORT: ${{ secrets.MYPETS_VPS_PORT || secrets.VPS_PORT || '22' }}
    steps:
      - name: Inspect edge source of truth read-only
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          command_timeout: 5m
          script: |
            set +e
            echo "=== EDGE DIRECTORY ==="
            ls -la /srv/platform/edge
            echo "=== EDGE GIT ==="
            git -C /srv/platform/edge rev-parse --is-inside-work-tree 2>/dev/null || true
            git -C /srv/platform/edge status --short 2>/dev/null || true
            git -C /srv/platform/edge branch --show-current 2>/dev/null || true
            git -C /srv/platform/edge remote -v 2>/dev/null || true
            git -C /srv/platform/edge log -5 --oneline 2>/dev/null || true
            echo "=== PAUSED FILE MTIME ==="
            stat /srv/platform/edge/paused/mypets.caddy 2>/dev/null || true
            echo "=== SITES DIR MTIMES ==="
            ls -lah --time-style=long-iso /srv/platform/edge/sites /srv/platform/edge/paused 2>/dev/null || true
