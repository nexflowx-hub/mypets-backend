name: Diagnose MyPets edge cutover

on:
  push:
    branches:
      - diag/api-tls-vps-20261005

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.MYPETS_VPS_HOST || secrets.VPS_HOST || secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.MYPETS_VPS_USER || secrets.VPS_USER || secrets.SSH_USER }}
      DEPLOY_KEY: ${{ secrets.MYPETS_VPS_SSH_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      DEPLOY_PORT: ${{ secrets.MYPETS_VPS_PORT || secrets.VPS_PORT || '22' }}
    steps:
      - name: Inspect cutover scripts read-only
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          command_timeout: 5m
          script: |
            set +e
            echo "=== CUTOVER.sh ==="
            sed -n '1,280p' /srv/platform/edge/CUTOVER.sh 2>/dev/null || true
            echo "=== ACTIVATE-LEVELAB.sh ==="
            sed -n '1,260p' /srv/platform/edge/ACTIVATE-LEVELAB.sh 2>/dev/null || true
            echo "=== files mentioning paused/mypets ==="
            grep -Rni -B4 -A12 -E 'paused|mypets|pixbrasil' /srv/platform/edge/*.sh /srv/platform/edge 2>/dev/null | head -320 || true
