name: Diagnose MyPets API TLS

on:
  push:
    branches:
      - diag/api-tls-vps-20261005
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.MYPETS_VPS_HOST || secrets.VPS_HOST || secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.MYPETS_VPS_USER || secrets.VPS_USER || secrets.SSH_USER }}
      DEPLOY_KEY: ${{ secrets.MYPETS_VPS_SSH_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      DEPLOY_PORT: ${{ secrets.MYPETS_VPS_PORT || secrets.VPS_PORT || '22' }}
    steps:
      - name: Check deploy credentials
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST:-}"
          test -n "${DEPLOY_USER:-}"
          test -n "${DEPLOY_KEY:-}"

      - name: Inspect production containers read-only
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          command_timeout: 5m
          script: |
            set +e
            echo "=== host/time ==="
            hostname
            date -u
            echo "=== all containers ==="
            docker ps -a --format 'name={{.Names}} image={{.Image}} status={{.Status}} ports={{.Ports}}'
            echo "=== compose projects ==="
            docker compose ls -a 2>/dev/null || true
            echo "=== MyPets compose state ==="
            if [ -f /srv/apps/mypets/api/deploy/compose.yml ]; then
              docker compose -p mypets -f /srv/apps/mypets/api/deploy/compose.yml ps -a || true
            fi
            echo "=== MyPets checkout state ==="
            if [ -d /srv/apps/mypets/api/.git ]; then
              git -C /srv/apps/mypets/api rev-parse HEAD || true
              git -C /srv/apps/mypets/api status --short || true
            fi
            echo "=== listeners 80/443/8081 ==="
            ss -ltnp | grep -E ':(80|443|8081)\b' || true
            echo "=== containers publishing 443 ==="
            for cid in $(docker ps -q --filter publish=443); do
              docker inspect -f 'name={{.Name}} image={{.Config.Image}} networks={{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' "$cid" || true
              echo "--- mounts ---"
              docker inspect -f '{{range .Mounts}}{{.Source}} -> {{.Destination}} ({{.Mode}}){{println}}{{end}}' "$cid" || true
              echo "--- last logs ---"
              docker logs --tail 160 "$cid" 2>&1 || true
            done
            echo "=== MyPets API stopped-container logs ==="
            for cid in $(docker ps -aq --filter name=mypets-api); do
              docker inspect -f 'name={{.Name}} image={{.Config.Image}} status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' "$cid" || true
              docker logs --tail 200 "$cid" 2>&1 || true
            done
            echo "=== local API probe ==="
            curl -v --max-time 5 http://127.0.0.1:8081/health 2>&1 || true
            echo "=== local TLS probe ==="
            timeout 10 openssl s_client -connect 127.0.0.1:443 -servername api.mypets.lat </dev/null 2>&1 | head -80 || true
