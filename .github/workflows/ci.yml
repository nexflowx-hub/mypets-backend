name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mypets_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mypets_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mypets_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/mypets_ci
      CORS_ORIGINS: http://localhost:3000
      SHOW_DEMO_IMPACT: "true"
      PAYMENT_PROVIDER: mock
      PAYMENTS_LIVE: "false"
      PAYOUTS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260904193000_init.sql
      - run: psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f supabase/seed.sql
      - run: npm run typecheck
      - run: npm run build
      - run: docker build -t mypets-backend:ci .
