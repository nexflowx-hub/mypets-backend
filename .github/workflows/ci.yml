name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mypets_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mypets_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mypets_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/mypets_ci
      CORS_ORIGINS: http://localhost:3000
      PUBLIC_DEMO_CONTENT: "false"
      PAYMENT_PROVIDER: mock
      PAYMENTS_LIVE: "false"
      PAYOUTS_ENABLED: "false"
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: test_publishable_key
      ADMIN_EMAILS: admin@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create Supabase Auth and Storage schema stubs
        run: |
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists auth;
          create table if not exists auth.users (id uuid primary key);
          create role anon nologin;
          create role authenticated nologin;
          create or replace function auth.jwt() returns jsonb language sql stable as $$ select '{}'::jsonb $$;

          create schema if not exists storage;
          create table storage.buckets (
            id text primary key,
            name text not null,
            public boolean not null default false,
            file_size_limit bigint,
            allowed_mime_types text[]
          );
          create table storage.objects (
            id uuid primary key default gen_random_uuid(),
            bucket_id text not null,
            name text not null,
            owner_id text
          );
          alter table storage.objects enable row level security;
          create or replace function storage.foldername(name text) returns text[]
          language sql immutable as $$ select string_to_array(trim(both '/' from name), '/')[1:greatest(array_length(string_to_array(trim(both '/' from name), '/'), 1)-1,0)] $$;
          create or replace function storage.extension(name text) returns text
          language sql immutable as $$ select case when position('.' in reverse(name)) > 0 then reverse(split_part(reverse(name), '.', 1)) else '' end $$;
          SQL
      - run: psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260904193000_init.sql
      - run: psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260905033000_core_platform.sql
      - run: psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260905050500_identity_roles.sql
      - run: psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260905054000_growth_funnels.sql
      - run: psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260905060000_causes_sponsorships.sql
      - run: psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260905150000_admin_claim_center.sql
      - run: psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260905193000_pet_media_storage.sql
      - run: psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f supabase/seed.sql
      - run: npm run typecheck
      - run: npm run build
      - run: docker build -t mypets-backend:ci .
